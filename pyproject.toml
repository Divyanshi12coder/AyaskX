[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ayaskx"
version = "0.1.0"
description = "AyaskX R&D platform for manganese reserve and production intelligence"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.setuptools.packages.find]
include = [
    "core*",
    "data*"
]
exclude = [
    "source_friend_v1*",
    "tests*"
]